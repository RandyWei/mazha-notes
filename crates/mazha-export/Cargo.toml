[package]
name = "mazha-export"
description = "码札导出：源文本 → HTML / PDF（Typst）/ DOCX / EPUB，纯 Rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
mazha-md = { path = "../mazha-md" }
# PDF 编译管线（决策 D21）：typst 编译器 + 布局/导出 + 工具集（内嵌字体 / 系统字体扫描）
typst = "0.15"
typst-layout = "0.15"
typst-pdf = "0.15"
typst-kit = { version = "0.15", features = ["embedded-fonts", "scan-fonts"] }
# DOCX 导出（docx-rs）
docx = "1.1.2"
thiserror = "1.0"
# EPUB 导出（ZIP 容器；与 docx-rs 复用同一 zip 版本，避免重复依赖）
zip = "0.5"

[lints]
workspace = true
