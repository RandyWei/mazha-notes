[package]
name = "mazha-core"
description = "码札核心：文档模型、编辑命令、撤销、光标/偏移映射、渲染投影（无 GUI 依赖）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
ropey = "1"
thiserror = "2"
# 语法高亮：用纯 Rust 的 fancy-regex 引擎（避免 onig 的 C 依赖），并自带语法/主题 dump
syntect = { version = "5", default-features = false, features = [
    "default-fancy",
    "default-syntaxes",
    "default-themes",
] }
mazha-md = { path = "../mazha-md" }
mazha-store = { path = "../mazha-store" }
mazha-crdt = { path = "../mazha-crdt" }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
