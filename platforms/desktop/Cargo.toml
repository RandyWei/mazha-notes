[package]
name = "mazha-desktop"
version = "0.1.0"
edition = "2024"
# 与根工作区一致（Typst/编译依赖的 MSRV 约束）
rust-version = "1.92"
license = "AGPL-3.0-or-later"
publish = false
description = "码札桌面端（GPUI + gpui-kit，见 SPEC §7.1）"

[dependencies]
# 共享核心：源文本真相 + 投影（路径依赖，独立于根 workspace 构建）
mazha-core = { path = "../../crates/mazha-core" }
# 行内解析：光标在链接内时展开原文、Cmd+点击取链接目标（见 `inline_links`）
mazha-md = { path = "../../crates/mazha-md" }
# 存储抽象（Workspace/FileSystemProvider/DocPath）
mazha-store = { path = "../../crates/mazha-store" }
# PDF 导出
mazha-export = { path = "../../crates/mazha-export" }
# 文件对话框
rfd = "0.14"
# 只声明 gpui-kit：GPUI 由它锁定版本/快照，避免两份 GPUI 类型不兼容（SPEC §7.1）
gpui-kit = "0.7"

[target.'cfg(target_os = "macos")'.dependencies]
# 中文斜体合成倾斜：取 CoreText 字形轮廓 → 剪切 → 自绘（见 `src/oblique.rs`）
core-text = "21"
core-graphics = "0.24"
core-foundation = "0.10"
foreign-types = "0.5"
