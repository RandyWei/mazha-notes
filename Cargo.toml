[workspace]
resolver = "3"
members = [
    "crates/mazha-core",
    "crates/mazha-md",
    "crates/mazha-crdt",
    "crates/mazha-store",
    "crates/mazha-export",
    "crates/mazha-plugin",
    "crates/mazha-ffi",
    "crates/mazha-wasm",
]
exclude = ["platforms"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Typst 0.15 要求 rustc ≥ 1.92（依赖 MSRV），故工作区 MSRV 与之对齐
rust-version = "1.92"
license = "AGPL-3.0-or-later"
authors = ["RandyWei <weizhengheng@chinahrt.com>"]
repository = ""

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# 文档注释中的产品名/专有名词不加反引号，属正常风格
doc_markdown = "allow"
# 占位/工具函数返回值不必强制 #[must_use]
must_use_candidate = "allow"
